[pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --strict-markers --tb=short --cov=. --cov-report=html --cov-report=xml --cov-report=term-missing --cov-fail-under=80
markers =
    integration: Integration test
    happy_path: Happy path test
    error_case: Error case test
    slow: Slow test
