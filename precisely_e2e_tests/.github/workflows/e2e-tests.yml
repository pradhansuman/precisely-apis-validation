name: Precisely API E2E Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 6 * * *'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - run: pip install -r requirements.txt
    - env:
        PRECISELY_API_KEY: ${{ secrets.PRECISELY_API_KEY }}
      run: pytest --cov=. --cov-report=xml
    - uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
  docker-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: docker/setup-buildx-action@v2
    - run: docker build -t precisely-e2e-tests .
    - env:
        PRECISELY_API_KEY: ${{ secrets.PRECISELY_API_KEY }}
      run: docker run -e PRECISELY_API_KEY precisely-e2e-tests
